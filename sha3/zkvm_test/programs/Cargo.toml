[package]
name = "zkvm-sha3-test"
version = "0.1.0"
edition = "2021"

[dependencies]
sha3 = { version = "0.11.0", default-features = false }
openvm = { git = "https://github.com/openvm-org/openvm", branch = "develop-v2.0.0-rc.1" }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Keep this package independent from the parent workspace
[workspace]

[patch.crates-io]
sha3 = { path = "../../" }
