[package]
name = "zkvm-host-test"
version = "0.1.0"
edition = "2021"

[dependencies]
openvm-sdk = { git = "https://github.com/openvm-org/openvm", tag = "v2.0.0", default-features = false }
openvm-sdk-config = { git = "https://github.com/openvm-org/openvm", tag = "v2.0.0" }
openvm-build = { git = "https://github.com/openvm-org/openvm", tag = "v2.0.0" }
openvm-stark-sdk = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.0.0", default-features = false, features = ["cpu-backend"] }
eyre = "0.6"

[[bin]]
name = "verify-keccak-chips"
path = "src/main.rs"

# Keep this package independent from the parent workspace
[workspace]
