[package]
name = "zkvm-sha2-test"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = { version = "0.11.0", default-features = false }
openvm = { git = "https://github.com/openvm-org/openvm", tag = "v2.0.0" }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Keep this package independent from the parent workspace
[workspace]

[patch.crates-io]
sha2 = { path = "../../" }
