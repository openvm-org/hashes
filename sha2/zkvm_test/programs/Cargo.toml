[package]
name = "zkvm-sha2-test"
version = "0.1.0"
edition = "2018"

[dependencies]
sha2 = { version = "0.10.8", default-features = false }
openvm = { git = "https://github.com/openvm-org/openvm", branch = "develop-v2.0.0-rc.1" }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Keep this package independent from the parent workspace
[workspace]

[patch.crates-io]
sha2 = { path = "../../" }
